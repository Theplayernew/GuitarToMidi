name: Build VST3

on: [workflow_dispatch]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
            cmake_args: -A x64
          - name: macOS-universal
            os: macos-latest
            cmake_args: ""
          - name: Linux-x64
            os: ubuntu-latest
            cmake_args: ""

    steps:
      - uses: actions/checkout@main

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@main
        with:
          name: GuitarToMidi-${{ matrix.name }}-VST3
          path: build/GuitarToMidi_artefacts/Release/VST3

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@main
        with:
          path: artifacts

      - name: Zip
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done

      - name: Set tag
        id: tag
        run: echo "TAG=$(date -u +%Y-%m-%d_%H%M)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: GuitarToMidi ${{ steps.tag.outputs.TAG }}
          generate_release_notes: true
          files: artifacts/*.zip